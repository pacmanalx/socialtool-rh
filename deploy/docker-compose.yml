# Instalação de servidor do SocialTool RH: app + MySQL + Mailpit, numa rede interna.
#
#   docker compose -p socialtool --env-file /caminho/socialtool.env -f deploy/docker-compose.yml up -d --build
#
# Todos os valores vêm do arquivo de ambiente (modelo em deploy/socialtool.env.example), que fica FORA do
# repositório. Portas publicadas só no loopback: quem chega de fora é o proxy reverso ou o túnel.
#
# E-mail: por padrão o SMTP é o Mailpit desta mesma instalação, que GUARDA as mensagens e não entrega nada.
# Para envio real, aponte SMTP_HOST para o seu servidor de e-mail e reveja EMAIL_REDIRECT_* (veja o README).

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-socialtool}
      MYSQL_USER: ${MYSQL_USER:-socialtool}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Caixa de entrada só no loopback do servidor; acesse por túnel SSH (ssh -L 8025:127.0.0.1:<porta> servidor).
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: socialtool:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-5185}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-America/Sao_Paulo}
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-socialtool};User=${MYSQL_USER:-socialtool};Password=${MYSQL_PASSWORD}"
      Jwt__SecretKey: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY}
      App__PublicUrl: ${PUBLIC_URL:?defina PUBLIC_URL}
      ForwardedHeaders__Enabled: ${BEHIND_PROXY:-true}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Bootstrap__OrganizationName: ${BOOTSTRAP_ORGANIZATION_NAME:-}
      Bootstrap__AdminName: ${BOOTSTRAP_ADMIN_NAME:-}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__GoogleWorkspaceDomains: ${BOOTSTRAP_GOOGLE_WORKSPACE_DOMAINS:-}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Redirect__Enabled: ${EMAIL_REDIRECT_ENABLED:-true}
      Email__Redirect__To: ${EMAIL_REDIRECT_TO:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-no-reply@socialtool.local}
      Email__Smtp__Host: ${SMTP_HOST:-mailpit}
      Email__Smtp__Port: ${SMTP_PORT:-1025}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__UseSsl: ${SMTP_USE_SSL:-false}

volumes:
  db-data:
